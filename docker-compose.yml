services:
  api:
    build: .
    image: mcanadas29dev/proyecto:latest
    container_name: hostiq-api
    restart: unless-stopped
    ports:
      - "8150:8150"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://hostiqes:${DB_PASSWORD}@host.docker.internal:5433/hostiqasyn
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - hostiq-net

  watchtower:
    image: containrrr/watchtower:latest
    container_name: hostiqasyn-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true                        # borra imágenes viejas
      - WATCHTOWER_LABEL_ENABLE=true                   # solo actualiza las etiquetadas
      - WATCHTOWER_POLL_INTERVAL=300                   # cada 5 minutos
    # No necesita red propia, usa la del host

networks:
  hostiq-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.32.0.0/16
