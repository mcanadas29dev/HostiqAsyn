[project]
name = "HostIQ_asyncrono"
version = "0.1.0"
description = "API con FastAPI Users, JWT y verificación de email"
requires-python = ">=3.11"
dependencies = [
    # Núcleo de FastAPI
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    
    # FastAPI Users con SQLAlchemy
    "fastapi-users[sqlalchemy]>=13.0.0",
    
    # Base de datos async
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    
    # Configuración y seguridad
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    
    # Migraciones
    "alembic>=1.14.0",
    
    # SMTP asíncrono para verificación de email
    "aiosmtplib>=3.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]